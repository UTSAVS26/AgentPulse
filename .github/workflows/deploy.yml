name: Deploy (Hugging Face Space)

# Auto-deploys main to the Hugging Face Space after CI passes, or on demand.
# Needs repository secrets HF_TOKEN (write token) and HF_SPACE (e.g. "UTSAVS26/agentpulse").
# Optional secrets synced to the Space: GROQ_API_KEY, OPENROUTER_API_KEY, TAVILY_API_KEY,
# LIVE_ACCESS_CODE (unlocks live mode), DATABASE_URL (persistent Postgres, e.g. Neon).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-space
  cancel-in-progress: false  # never interrupt an upload half-way

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Hugging Face Space
    # Only after a *successful* CI run for a *push* to main (never for PRs or forks).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: huggingface-space
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy exactly the commit that CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deploy tooling
        run: pip install huggingface_hub==1.33.0
      - name: Build, upload and wait for the Space to run
        id: deploy
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          LIVE_ACCESS_CODE: ${{ secrets.LIVE_ACCESS_CODE }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: python scripts/deploy_space.py
